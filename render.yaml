services:
  - type: web
    name: medicare-pharmacy
    env: node
    plan: free
    region: singapore
    buildCommand: npm run build:all
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: WHATSAPP_NUMBER
        value: "919876543210"
      - key: MONGODB_URI
        sync: false
